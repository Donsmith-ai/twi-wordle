<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Daily Word — EN · ES · Twi</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="title">Daily Word</h1>
        <div class="lang-row">
          <label class="sr-only" for="lang-select">Language</label>
          <select id="lang-select" aria-label="Game language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="tw">Twi</option>
          </select>
          <label class="sr-only" for="word-len-select">Word length</label>
          <select id="word-len-select" aria-label="Letters per word"></select>
        </div>
        <p id="game-instruction" class="sub" lang="en">
          4–6 letters · 8 guesses · one puzzle each local day (per language &amp; length).
        </p>
      </header>

      <main id="game-root" class="main" tabindex="-1" aria-label="Game board">
        <div class="board-shell">
          <div class="board-column">
            <div
              id="connection-banner"
              class="banner"
              hidden
              role="alert"
            ></div>
            <div id="board" class="board" aria-label="Guesses"></div>

            <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

            <p id="played-today-msg" class="played-today-msg" hidden>
              You finished today’s puzzle. Come back tomorrow, or tap <strong>New round</strong> to clear saved progress if you’re stuck.
            </p>
            <button type="button" id="btn-reset" class="btn btn-reset" hidden>
              New round
            </button>

            <div
              id="invalid-overlay"
              class="invalid-overlay"
              hidden
              aria-hidden="true"
            >
              <div class="invalid-popup" role="alertdialog" aria-labelledby="invalid-msg">
                <div class="invalid-emoji" aria-hidden="true">
                  <picture>
                    <source
                      srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f642_200d_2194_fe0f/512.webp"
                      type="image/webp"
                    />
                    <img
                      src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f642_200d_2194_fe0f/512.gif"
                      alt="🙂"
                      width="32"
                      height="32"
                    />
                  </picture>
                </div>
                <p id="invalid-msg" class="invalid-msg">Not in word list</p>
              </div>
            </div>

            <div id="end-modal" class="modal" hidden>
              <div class="modal__panel">
                <h2 id="end-title"></h2>
                <p id="end-answer" class="end-answer"></p>
                <p id="end-definition" class="end-definition" aria-live="polite" hidden></p>
                <div id="win-share-panel" class="win-share-panel" hidden>
                  <div id="end-stats" class="end-stats"></div>
                  <div class="modal__actions modal__actions--win">
                    <button type="button" id="btn-share" class="btn primary">
                      Share image
                    </button>
                  </div>
                  <p id="share-hint" class="share-hint">
                    Uses today’s global stats for this language &amp; date.
                  </p>
                </div>
                <div class="modal__actions">
                  <button type="button" id="btn-dismiss" class="btn">Close</button>
                </div>
              </div>
            </div>
          </div>

          <aside
            class="color-legend"
            id="color-legend"
            lang="en"
            role="complementary"
            aria-labelledby="color-legend-heading"
          >
            <h2 id="color-legend-heading" class="color-legend__title"></h2>
            <p id="color-legend-intro" class="color-legend__intro"></p>
            <ul class="color-legend__list">
              <li class="color-legend__item">
                <span class="color-legend__swatch color-legend__swatch--correct" aria-hidden="true"></span>
                <span id="legend-line-correct" class="color-legend__text"></span>
              </li>
              <li class="color-legend__item">
                <span class="color-legend__swatch color-legend__swatch--present" aria-hidden="true"></span>
                <span id="legend-line-present" class="color-legend__text"></span>
              </li>
              <li class="color-legend__item">
                <span class="color-legend__swatch color-legend__swatch--absent" aria-hidden="true"></span>
                <span id="legend-line-absent" class="color-legend__text"></span>
              </li>
            </ul>
            <p id="color-legend-footer" class="color-legend__footer"></p>
          </aside>
        </div>

        <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
      </main>
    </div>
    <canvas id="share-canvas" width="400" height="520" hidden></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
